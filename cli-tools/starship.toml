"$schema" = "https://starship.rs/config-schema.json"

palette = "gruvbox_dark"

add_newline = false
scan_timeout = 10

format = "$directory$git_branch$git_status$character"
right_format = "$aws$nodejs$python${custom.python_venv_path}$rust$golang$package$cmd_duration$status"

[palettes.gruvbox_dark]
text = "#ebdbb2"
subtext0 = "#d5c4a1"
overlay0 = "#928374"
surface1 = "#504945"
surface2 = "#a89984"
blue = "#83a598"
green = "#b8bb26"
yellow = "#fabd2f"
peach = "#fe8019"
red = "#fb4934"

[directory]
style = "fg:text"
truncation_length = 3
truncate_to_repo = false
repo_root_style = "bold fg:blue"
before_repo_root_style = "fg:overlay0"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style) "
read_only = " ro"
read_only_style = "fg:red"

[git_branch]
symbol = "git "
style = "fg:subtext0"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "*"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[aws]
symbol = "aws "
style = "fg:peach"
format = "[$symbol$profile($region)]($style) "

[nodejs]
symbol = "node "
style = "fg:green"
format = "[$symbol$version]($style) "

[python]
symbol = "py "
style = "fg:green"
format = "[$symbol$version(\\($virtualenv\\))]($style) "

[custom.python_venv_path]
when = true
command = '''
if [ -n "$VIRTUAL_ENV" ]; then
  printf %s "$VIRTUAL_ENV" | awk -F/ '{
    if (NF >= 2) {
      print "…/" $(NF-1) "/" $NF
    } else {
      print $0
    }
  }'
fi
'''
shell = ["sh"]
style = "fg:overlay0"
format = "[$output]($style) "

[rust]
symbol = "rs "
style = "fg:peach"
format = "[$symbol$version]($style) "

[golang]
symbol = "go "
style = "fg:blue"
format = "[$symbol$version]($style) "

[package]
symbol = "pkg "
style = "fg:surface2"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = "[took $duration]($style) "

[status]
disabled = false
style = "fg:red"
symbol = "x "
success_symbol = ""
format = "[$symbol$status]($style) "
map_symbol = true

[character]
success_symbol = "[❯](bold fg:surface2)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:blue)"
